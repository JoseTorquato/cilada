[project]
name = "cilada-redteam"
version = "0.1.0"
description = "Suíte adversarial em português brasileiro para agentes de IA em produção"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Torquato", email = "jltorquato12@gmail.com" }]
keywords = ["llm", "red-team", "security", "evals", "portuguese", "chatbot", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://josetorquato.dev"
Source = "https://github.com/JoseTorquato/cilada"

[project.scripts]
cilada = "cilada.cli:main"
cilada-compara = "cilada.compara:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cilada"]

# os ataques moram na raiz (fácil de editar e revisar em PR), mas precisam
# viajar dentro do wheel — senão `pip install cilada` entrega o runner vazio
[tool.hatch.build.targets.wheel.force-include]
"attacks" = "cilada/attacks"
